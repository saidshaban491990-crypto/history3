    <style>
        :root { --primary: #065f46; --accent: #047857; --success: #059669; --danger: #dc2626; --bg: #f0fdf4; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #dcfce7; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; flex-direction: column; padding: 10px; }
        .main-card { width: 100%; max-width: 600px; background: white; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 4px solid var(--primary); overflow: hidden; }
        .top-nav-bar { background: linear-gradient(135deg, var(--primary), #10b981); color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 3px solid var(--accent); }
        .content { padding: 30px; text-align: center; }
        .teacher-img { width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--accent); margin-bottom: 20px; object-fit: cover; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--accent); text-align: center; font-size: 16px; margin-bottom: 20px; }
        .btn-main { background: var(--accent); color: white; border: none; padding: 15px 40px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .stages-nav { display: flex; width: 100%; max-width: 600px; margin-bottom: 15px; border: 2px solid var(--primary); border-radius: 12px; overflow: hidden; }
        .stage-item { flex: 1; padding: 10px 5px; font-size: 10px; font-weight: bold; text-align: center; color: var(--primary); border-left: 1px solid #a7f3d0; }
        .stage-item.current { background: var(--accent); color: white; }
        .stage-item.done { background: var(--primary); color: white; }
        .q-card { background: var(--bg); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 2px dashed var(--primary); font-size: 18px; font-weight: bold; line-height: 1.5; }
        .btn-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .btn-opt { background: white; border: 2px solid var(--accent); padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; color: var(--primary); transition: 0.3s; }
        .correct { background: var(--success) !important; color: white !important; border-color: #047857 !important; }
        .wrong { background: var(--danger) !important; color: white !important; border-color: #b91c1c !important; }
        .feedback { color: var(--danger); font-weight: bold; margin-bottom: 15px; font-size: 16px; display: none; background: #fee2e2; padding: 10px; border-radius: 10px; }
        .footer-identity { padding: 15px; font-size: 14px; color: var(--primary); font-weight: bold; text-align: center; background: #f8fafc; border-top: 2px solid var(--accent); }
        .screen { display: none; }
        .active-screen { display: block; }
        #final-msg { font-size: 20px; font-weight: bold; color: var(--primary); margin: 20px 0; line-height: 1.6; }
    </style>
</head>

<script>

const lessonName = "الحضارة الإسلامية";
const GAS_URL = "https://script.google.com/macros/s/AKfycbwZPW9fYT-pqjedH8e81aV9lf5ejc9DZ3AmQo2z78sBC9tIatdRkoGSJngHyOFSZRqPmw/exec";

    {q: "برع المسلمون في صناعات متعددة مثل الزجاج والمنسوجات والورق.", ans: 0, opts: ["صواب", "خطأ"], type: 0, corr: "صواب"},
    {q: "يُعد \"تاج محل\" في الهند جوهرة العمارة في الحضارة الإسلامية.", ans: 0, opts: ["صواب", "خطأ"], type: 0, corr: "صواب"},

const vCor = document.getElementById('vCor'), vErr = document.getElementById('vErr');

document.getElementById('startBtn').onclick = () => {
    userName = document.getElementById('uName').value;
    if(userName.length < 3) return alert("أدخل الاسم الثلاثي");
    startTime = new Date();
    document.getElementById('sWelcome').play();
    document.getElementById('scr-1').classList.remove('active-screen');
    document.getElementById('scr-2').classList.add('active-screen');
    document.getElementById('stagesNav').style.display = 'flex';
    loadQ();
};

function loadQ() {
    const q = quiz[cur];
    document.getElementById('qText').innerText = q.q;
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('q-count').innerText = "السؤال: " + (cur+1);
    document.querySelectorAll('.stage-item').forEach((el, i) => {
        el.className = 'stage-item ' + (i === q.type ? 'current' : i < q.type ? 'done' : '');
    });
    const optsDiv = document.getElementById('options');
    optsDiv.innerHTML = "";
    let buttons = [];
    q.opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.className = 'btn-opt'; b.innerText = o;
        b.onclick = () => check(i, b, buttons);
        optsDiv.appendChild(b);
        buttons.push(b);
    });
}

function check(i, b, btns) {
    if(!canAnswer) return;
    canAnswer = false;
    const feedback = document.getElementById('feedback');
    if(i === quiz[cur].ans) {
        score++; b.classList.add('correct');
        document.getElementById('sCor').play();
        setTimeout(() => vCor.play(), 300);
    } else {
        b.classList.add('wrong');
        btns[quiz[cur].ans].classList.add('correct');
        document.getElementById('sErr').play();
        feedback.innerText = quiz[cur].corr;
        feedback.style.display = 'block';
        setTimeout(() => vErr.play(), 300);
    }
    document.getElementById('s-val').innerText = "الدرجة: " + score;
}

function nextQ() {
    cur++;
    canAnswer = true;
    if(cur < quiz.length) loadQ();
    else sendResult();
}

function sendResult() {
    const duration = Math.round((new Date() - startTime) / 1000);
    const params = new URLSearchParams({name: userName, lesson: lessonName, score: score, duration: duration});
    fetch(GAS_URL, { method: 'POST', mode: 'no-cors', body: params })
    .then(() => { 
        document.getElementById('scr-2').classList.remove('active-screen');
        document.getElementById('scr-3').classList.add('active-screen');
        document.getElementById('stagesNav').style.display = 'none';
        
        let message = "";
        const percentage = (score / quiz.length) * 100;

        if (percentage >= 85) {
            message = "أهلاً " + userName + "، ممتاز يا بطل! 🌟 درجتك " + score + " من " + quiz.length + ". أداء رائع يعكس تفوقك، تم إرسالها إلى أ: سعيد شعبان.";
        } else if (percentage >= 50) {
            message = "أهلاً " + userName + "، جيد جداً! 👏 حصلت على " + score + " من " + quiz.length + ". راجع أخطاءك لتصبح أفضل، تم إرسالها إلى أ: سعيد شعبان.";
        } else {
            message = "أهلاً " + userName + "، تحتاج للمحاولة مرة أخرى! 💪 حصلت على " + score + " من " + quiz.length + ". حاول مجدداً لتتحسن، تم إرسالها إلى أ: سعيد شعبان.";
        }
        document.getElementById('final-msg').innerText = message;
    });
}

vCor.onended = nextQ;
vErr.onended = nextQ;
</script>
</body>
</html>
